<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 - One More Night | Carta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --border: #262626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }
        
        header {
            text-align: center;
            padding: 25px 20px 15px;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,10,0.95);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-img { max-width: 60px; margin-bottom: 8px; filter: drop-shadow(0 2px 8px rgba(255,255,255,0.1)); }
        h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; }
        .mesa-badge { display: inline-block; margin-top: 5px; padding: 4px 12px; background: #222; border-radius: 20px; font-size: 0.85rem; color: #aaa; border: 1px solid #333; }

        /* Categorías */
        .categorias {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 15px 20px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .categorias::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .cat-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }

        /* Contenedor de Tragos */
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .seccion-titulo {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin: 25px 0 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 3px solid #fff;
            padding-left: 10px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .item-info { flex-grow: 1; padding-right: 15px; }
        .item-nombre { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
        .item-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; }
        .item-precio { font-size: 1rem; font-weight: 700; color: #fff; margin-top: 6px; }
        
        .contador {
            display: flex;
            align-items: center;
            background: #1f1f1f;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .btn-cant { background: none; border: none; color: #fff; font-size: 1.1rem; width: 32px; height: 32px; cursor: pointer; }
        .num-cant { width: 28px; text-align: center; font-size: 0.95rem; font-weight: 600; }

        /* Barra Inferior del Pedido */
        .footer-pedido {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .total-texto { font-size: 0.9rem; color: var(--text-muted); }
        .total-monto { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .btn-enviar { background: #fff; color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* Pantalla de PIN */
        #pin-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .pin-box {
            background: #141414;
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        .pin-box h2 { font-size: 1.4rem; margin-bottom: 10px; }
        .pin-box p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
        .pin-input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 14px;
            font-size: 1.5rem;
            text-align: center;
            border-radius: 8px;
            letter-spacing: 6px;
            margin-bottom: 15px;
        }
        .pin-btn { width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .error-pin { color: #ff4444; font-size: 0.8rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="pin-overlay">
        <div class="pin-box">
            <img src="{{ url_for('static', filename='logo_100.png') }}" alt="Logo 100" style="width: 50px; margin-bottom: 12px;">
            <h2>INGRESO MESA</h2>
            <p>Ingresa el PIN provisto en la barra para acceder a la carta.</p>
            <input type="password" id="pin-input" class="pin-input" maxlength="6" placeholder="••••">
            <button onclick="validarPin()" class="pin-btn">INGRESAR</button>
            <div id="error-msg" class="error-pin">PIN incorrecto. Intenta nuevamente.</div>
        </div>
    </div>

    <header>
        <img src="{{ url_for('static', filename='logo_100.png') }}" alt="Logo 100" class="logo-img">
        <h1>100 ONE MORE NIGHT</h1>
        <div class="mesa-badge" id="label-mesa">Mesa --</div>
    </header>

    <div class="categorias">
        <button class="cat-btn active" onclick="filtrar('todos')">Todo</button>
        <button class="cat-btn" onclick="filtrar('Cocktails')">Cocktails</button>
        <button class="cat-btn" onclick="filtrar('Vinos & Espumantes')">Vinos & Espumantes</button>
        <button class="cat-btn" onclick="filtrar('Cervezas')">Cervezas</button>
        <button class="cat-btn" onclick="filtrar('Sin Alcohol')">Sin Alcohol</button>
    </div>

    <div class="container" id="menu-container"></div>

    <div class="footer-pedido">
        <div>
            <div class="total-texto">Total estimado</div>
            <div class="total-monto" id="total-precio">$0</div>
        </div>
        <button class="btn-enviar" onclick="enviarPedido()">ENVIAR PEDIDO</button>
    </div>

    <script>
        // Carta completa de bebidas actualizada
        const cartaItems = [
            { id: 1, categoria: "Cocktails", nombre: "Fernet 100", desc: "Fernet Branca con Coca-Cola tirada bien helada.", precio: 7000 },
            { id: 2, categoria: "Cocktails", nombre: "Gin Tonic 100", desc: "Gin artesanal, agua tónica premium, rodaja de limón.", precio: 7500 },
            { id: 3, categoria: "Cocktails", nombre: "Vodka con Speed / Naranja", desc: "Vodka importado con energizante o jugo cítrico.", precio: 7500 },
            { id: 4, categoria: "Cocktails", nombre: "Campari Orange", desc: "Campari con jugo de naranja exprimido y hielo.", precio: 7200 },
            { id: 5, categoria: "Cocktails", nombre: "Ron con Cola", desc: "Ron añejo con Coca-Cola y lima.", precio: 7000 },
            { id: 6, categoria: "Cocktails", nombre: "Mulberry Spritz", desc: "Espumante, cordial de frutos rojos y agua tónica.", precio: 8000 },
            { id: 7, categoria: "Cocktails", nombre: "Yorkers Vibes", desc: "Bourbon, reducción de frutas de estación y cítricos.", precio: 8500 },
            { id: 8, categoria: "Cocktails", nombre: "Gangsta Tape", desc: "Trago de autor fuerte a base de ron especiado y jengibre.", precio: 8500 },
            { id: 9, categoria: "Vinos & Espumantes", nombre: "Champagne Extra Brut", desc: "Botella 750ml ideal para brindar en la noche.", precio: 22000 },
            { id: 10, categoria: "Vinos & Espumantes", nombre: "Vino Tinto Malbec (Copa)", desc: "Copa de vino seleccionado de alta gama.", precio: 6000 },
            { id: 11, categoria: "Cervezas", nombre: "Cerveza Corona (Línea)", desc: "Botella 330ml con limón.", precio: 5500 },
            { id: 12, categoria: "Cervezas", nombre: "Cerveza Patagonia Amber Lager", desc: "Pinta tirada artesanal.", precio: 5800 },
            { id: 13, categoria: "Sin Alcohol", nombre: "Agua Mineral / Saborizada", desc: "500ml sin gas o con gas.", precio: 3000 },
            { id: 14, categoria: "Sin Alcohol", nombre: "Bebida Energizante Speed", desc: "Lata 250ml.", precio: 4500 }
        ];

        let carrito = {};
        let mesaActual = "1";

        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('mesa')) { mesaActual = urlParams.get('mesa'); }
        document.getElementById('label-mesa').innerText = "Mesa " + mesaActual;

        if(sessionStorage.getItem('pin_ok') === 'true') {
            document.getElementById('pin-overlay').style.display = 'none';
        }

        function validarPin() {
            let pinIngresado = document.getElementById('pin-input').value;
            fetch('/api/verificar-pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: pinIngresado })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    sessionStorage.setItem('pin_ok', 'true');
                    document.getElementById('pin-overlay').style.display = 'none';
                } else {
                    let err = document.getElementById('error-msg');
                    err.style.display = 'block';
                    setTimeout(() => err.style.display = 'none', 3000);
                }
            });
        }

        function renderizarMenu(filtro = 'todos') {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            let categoriasUnicas = filtro === 'todos' ? [...new Set(cartaItems.map(i => i.categoria))] : [filtro];

            categoriasUnicas.forEach(cat => {
                let itemsCat = cartaItems.filter(i => i.categoria === cat);
                if(itemsCat.length === 0) return;

                let htmlCat = `<div class="seccion-titulo">${cat}</div>`;
                itemsCat.forEach(item => {
                    let cant = carrito[item.id] || 0;
                    htmlCat += `
                        <div class="menu-item">
                            <div class="item-info">
                                <div class="item-nombre">${item.nombre}</div>
                                <div class="item-desc">${item.desc}</div>
                                <div class="item-precio">$${item.precio.toLocaleString()}</div>
                            </div>
                            <div class="contador">
                                <button class="btn-cant" onclick="cambiarCant(${item.id}, -1)">-</button>
                                <span class="num-cant" id="cant-${item.id}">${cant}</span>
                                <button class="btn-cant" onclick="cambiarCant(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML += htmlCat;
            });
        }

        function filtrar(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderizarMenu(cat);
        }

        function cambiarCant(id, delta) {
            if(!carrito[id]) carrito[id] = 0;
            carrito[id] += delta;
            if(carrito[id] < 0) carrito[id] = 0;
            document.getElementById(`cant-${id}`).innerText = carrito[id];
            actualizarTotal();
        }

        function actualizarTotal() {
            let total = 0;
            for(let id in carrito) {
                let item = cartaItems.find(i => i.id == id);
                if(item) total += item.precio * carrito[id];
            }
            document.getElementById('total-precio').innerText = '$' + total.toLocaleString();
        }

        function enviarPedido() {
            let itemsPedido = [];
            for(let id in carrito) {
                if(carrito[id] > 0) {
                    let item = cartaItems.find(i => i.id == id);
                    itemsPedido.push({ nombre: item.nombre, cantidad: carrito[id], precio: item.precio });
                }
            }
            if(itemsPedido.length === 0) { alert("Selecciona al menos una bebida."); return; }

            fetch('/api/pedido', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mesa: mesaActual, items: itemsPedido })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert("¡Pedido enviado a la barra con éxito!");
                    carrito = {};
                    renderizarMenu();
                    actualizarTotal();
                } else { alert("Error al enviar pedido."); }
            });
        }

        renderizarMenu();
    </script>
</body>
</html>
