<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 - One More Night | Menú</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050505; color: #f8fafc; margin: 0; padding: 15px; }
        
        .header-boliche { text-align: center; margin-bottom: 20px; padding-top: 10px; border-bottom: 2px solid #ef4444; padding-bottom: 15px; }
        .logo-100 { font-size: 3rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444; letter-spacing: 2px; margin: 0; }
        .sub-slogan { font-size: 0.85rem; color: #94a3b8; letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
        .mesa-badge { background: #1e293b; display: inline-block; padding: 5px 12px; border-radius: 20px; font-weight: bold; color: #38bdf8; margin-top: 8px; border: 1px solid #334155; font-size: 0.85rem; }

        /* Capa de Validación de PIN */
        #pinOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,5,0.95); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .pin-box { background: #111827; padding: 25px; border-radius: 12px; width: 320px; border: 1px solid #ef4444; text-align: center; box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
        .pin-box h3 { color: #fff; margin-bottom: 10px; }
        .pin-input { width: 80%; padding: 10px; font-size: 1.2rem; text-align: center; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px; margin-bottom: 15px; letter-spacing: 3px; }
        .btn-pin { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }

        .categoria-titulo { color: #f43f5e; font-size: 1.1rem; border-bottom: 1px solid #1e293b; padding-bottom: 5px; margin-top: 20px; font-weight: bold; }
        .bebida-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .bebida-info h3 { margin: 0 0 5px 0; font-size: 1rem; color: #fff; }
        .precio { color: #34d399; font-weight: bold; font-size: 0.95rem; }
        
        .controles-cantidad { display: flex; align-items: center; gap: 10px; }
        .btn-cant { background: #374151; color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .input-cant { width: 35px; text-align: center; background: #1f2937; border: none; color: white; font-weight: bold; font-size: 1rem; border-radius: 4px; }

        .carrito-flotante { position: fixed; bottom: 0; left: 0; width: 100%; background: #111827; border-top: 2px solid #ef4444; padding: 15px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .btn-enviar { background: #ef4444; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- Ventana flotante para pedir el PIN al escanear el QR -->
    <div id="pinOverlay">
        <div class="pin-box">
            <h2 class="logo-100" style="font-size: 2rem; margin-bottom: 5px;">100</h2>
            <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 15px;">ONE MORE NIGHT</div>
            <h3>Ingresa el PIN de la Mesa</h3>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px;">Solicítalo al personal del boliche para habilitar los pedidos.</p>
            <input type="password" id="inputPin" class="pin-input" placeholder="----" maxlength="4">
            <br>
            <button class="btn-pin" onclick="validarPin()">Ingresar al Menú</button>
            <div id="errorPin" style="color: #f87171; font-size: 0.8rem; margin-top: 10px;"></div>
        </div>
    </div>

    <div class="header-boliche">
        <h1 class="logo-100">100</h1>
        <div class="sub-slogan">One More Night</div>
        <div class="mesa-badge">Mesa N° <span id="numMesaTexto">{{ mesa }}</span></div>
    </div>

    <div id="menu-container"></div>
    <div style="height: 90px;"></div>

    <div class="carrito-flotante">
        <div>
            <div style="font-size: 0.8rem; color: #94a3b8;">Total Pedido:</div>
            <div style="font-size: 1.2rem; font-weight: bold; color: #34d399;">$ <span id="totalGeneral">0</span></div>
        </div>
        <button class="btn-enviar" onclick="enviarPedido()">Enviar Pedido</button>
    </div>

    <script>
        const numeroMesa = "{{ mesa }}";
        const bebidas = [
            {% for b in bebidas %}
            { id: {{ b.id }}, nombre: "{{ b.nombre }}", precio: {{ b.precio }}, categoria: "{{ b.categoria }}" },
            {% endfor %}
        ];
        let cantidades = {};

        function validarPin() {
            let pin = document.getElementById('inputPin').value;
            fetch('/verificar_pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: pin })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('pinOverlay').style.display = 'none';
                    renderizarMenu();
                } else {
                    document.getElementById('errorPin').innerText = data.mensaje;
                }
            });
        }

        function renderizarMenu() {
            const container = document.getElementById('menu-container');
            let categorias = {};
            bebidas.forEach(b => {
                if (!categorias[b.categoria]) categorias[b.categoria] = [];
                categorias[b.categoria].push(b);
            });

            let html = '';
            for (let cat in categorias) {
                html += `<div class="categoria-titulo">${cat}</div>`;
                categorias[cat].forEach(bebida => {
                    let cant = cantidades[bebida.id] || 0;
                    html += `
                        <div class="bebida-card">
                            <div class="bebida-info">
                                <h3>${bebida.nombre}</h3>
                                <div class="precio">$${bebida.precio}</div>
                            </div>
                            <div class="controles-cantidad">
                                <button class="btn-cant" onclick="cambiarCantidad(${bebida.id}, -1)">-</button>
                                <input type="text" class="input-cant" id="cant-${bebida.id}" value="${cant}" readonly>
                                <button class="btn-cant" onclick="cambiarCantidad(${bebida.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        function cambiarCantidad(id, delta) {
            if (!cantidades[id]) cantidades[id] = 0;
            cantidades[id] += delta;
            if (cantidades[id] < 0) cantidades[id] = 0;
            document.getElementById(`cant-${id}`).value = cantidades[id];
            calcularTotal();
        }

        function calcularTotal() {
            let total = 0;
            bebidas.forEach(b => { if (cantidades[b.id]) total += b.precio * cantidades[b.id]; });
            document.getElementById('totalGeneral').innerText = total;
        }

        function enviarPedido() {
            let items = [];
            bebidas.forEach(b => {
                if (cantidades[b.id] && cantidades[b.id] > 0) {
                    items.push({ nombre: b.nombre, precio: b.precio, cantidad: cantidades[b.id] });
                }
            });

            if (items.length === 0) {
                alert("Por favor selecciona al menos una bebida.");
                return;
            }

            fetch('/enviar_pedido', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mesa: numeroMesa, items: items })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    alert("¡Pedido enviado con éxito a la barra de 100!");
                    cantidades = {};
                    renderizarMenu();
                    calcularTotal();
                } else {
                    alert("Error: " + data.mensaje);
                }
            });
        }
    </script>
</body>
</html>
