<!-- Listado de Ventas Históricas y Diarias -->
        <div style="grid-column: 1 / -1; margin-top: 20px;">
            <div class="card">
                <h3>Historial de Ventas y Cierres de Caja (Persistente por Día)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Mesa</th>
                            <th>Detalle</th>
                            <th>Total Cobrado</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for v in ventas %}
                        <tr>
                            <td>{{ v.fecha }}</td>
                            <td style="color: #888;">{{ v.timestamp }}</td>
                            <td><b>Mesa {{ v.mesa }}</b></td>
                            <td>{{ v.detalle }}</td>
                            <td style="color: #00cc44; font-weight: bold;">${{ "{:,}".format(v.total).replace(',', '.') }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="5" style="text-align: center; color: #666; padding: 20px;">Aún no hay ventas registradas.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
