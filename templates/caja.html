<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 - Panel de Caja</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body { background: #0a0a0a; color: #f0f0f0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 25px; letter-spacing: 2px; }
        .grid-mesas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .mesa-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 15px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .mesa-card.ocupada { border-color: #fff; background: #1a1a1a; }
        .mesa-titulo { font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .item-lista { font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
        .btn-liberar {
            background: #333; color: #fff; border: none; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 600;
        }
        .btn-liberar:hover { background: #ff4444; }
    </style>
    <!-- Recargar página cada 10 segundos para ver pedidos nuevos -->
    <meta http-equiv="refresh" content="10">
</head>
<body>
    <h1>PANEL DE CAJA - 100 MESAS</h1>
    <div class="grid-mesas">
        {% for num, items in mesas.items() %}
        <div class="mesa-card {% if items %}ocupada{% endif %}">
            <div>
                <div class="mesa-titulo">
                    <span>Mesa {{ num }}</span>
                    <span>{% if items %}🔴{% else %}🟢{% endif %}</span>
                </div>
                {% if items %}
                    {% for item in items %}
                    <div class="item-lista">• {{ item.cantidad }}x {{ item.nombre }}</div>
                    {% endfor %}
                {% else %}
                    <div style="color: #666; font-size: 0.85rem; font-style: italic;">Sin pedidos</div>
                {% endif %}
            </div>
            {% if items %}
            <button class="btn-liberar" onclick="liberarMesa('{{ num }}')">LIBERAR MESA</button>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <script>
        function liberarMesa(numMesa) {
            if(confirm("¿Estás seguro de liberar la mesa " + numMesa + "?")) {
                fetch('/api/liberar/' + numMesa, { method: 'POST' })
                .then(() => location.reload());
            }
        }
    </script>
</body>
</html>
